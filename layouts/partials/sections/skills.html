{{/*
  Editorial skills: two-column typographic list.
  Left column = small-caps category label.
  Right column = comma-separated keywords in body sans.
*/}}
<div class="skills-section">
  {{ with .categories }}
    <dl class="skills-list">
      {{ range . }}
        <div class="skills-row">
          <dt class="skills-label">{{ .label }}</dt>
          <dd class="skills-items">{{ delimit .items ", " }}</dd>
        </div>
      {{ end }}
    </dl>
  {{ end }}
</div>
